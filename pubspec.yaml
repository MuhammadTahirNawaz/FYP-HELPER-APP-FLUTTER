name: fyp_helper_app
description: "FYP Helper — final-year project management for students, supervisors, committee, and admins. Targets Android, Windows desktop, and Web (Chrome/Edge)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.4.2
  cloud_functions: ^5.5.0
  firebase_database: ^11.0.4
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  encrypt: ^5.0.3
  file_selector: ^1.0.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  dio: ^5.9.2
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.4
  google_mobile_ads: ^5.1.0
  provider: ^6.1.5+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
